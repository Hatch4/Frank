<!DOCTYPE html>
<html>
<head>
  <title>Climber Race</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* Fix mobile highlight issues */
    * {
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* FULL SCREEN CANVAS */
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 75vh; /* top 75% of screen */
      background: #222;
    }

    #menu {
      text-align: center;
      margin-top: 20px;
      color: white;
      position: absolute;
      width: 100%;
      z-index: 10;
    }

    button {
      padding: 12px 24px;
      font-size: 22px;
      margin: 5px;
      border-radius: 10px;
      border: none;
      background: #ffdd55;
      font-weight: bold;
      cursor: pointer;
    }

    /* BIG MOBILE CONTROLS */
    #mobileControls {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 25vh;
      background: rgba(0,0,0,0.4);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }

    #mobileControls button {
      width: 40vw;
      height: 18vh;
      font-size: 50px;
      border-radius: 25px;
      background: #ffdd55;
      border: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="menu">
  <h1>Choose Your Character</h1>
  <button onclick="startGame('boy')">Boy</button>
  <button onclick="startGame('girl')">Girl</button>
</div>

<canvas id="gameCanvas" width="500" height="700"></canvas>

<div id="mobileControls">
  <button id="leftBtn">◀</button>
  <button id="rightBtn">▶</button>
</div>

<script src="game.js"></script>

</body>
</html>
